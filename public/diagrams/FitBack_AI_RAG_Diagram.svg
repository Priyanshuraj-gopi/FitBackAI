<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080" style="background:#FAF8F4; font-family:'Plus Jakarta Sans', system-ui, sans-serif;">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAF8F4"/>
      <stop offset="100%" stop-color="#F1EDE5"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#242321" flood-opacity="0.08"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#A85F48"/>
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#2E5A44"/>
    </marker>
  </defs>

  <!-- Canvas Background -->
  <rect width="1920" height="1080" fill="url(#bgGrad)"/>
  
  <!-- Header Bar -->
  <rect x="80" y="50" width="1760" height="100" rx="20" fill="#242321" filter="url(#shadow)"/>
  <text x="120" y="105" font-family="'Playfair Display', Georgia, serif" font-size="34" font-weight="bold" fill="#FAF8F4">RAG ARCHITECTURE: RETRIEVE BEFORE YOU RESPOND</text>
  <text x="120" y="132" font-size="16" font-weight="500" fill="#E68A6E" letter-spacing="2">FITBACK-AI KNOWLEDGE GROUNDING &amp; VECTOR SEARCH PIPELINE</text>
  <rect x="1660" y="80" width="140" height="40" rx="10" fill="#A85F48"/>
  <text x="1730" y="105" font-size="14" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ACTIVE RAG</text>

  <!-- STAGE 1: Brand Knowledge Sources -->
  <rect x="80" y="180" width="340" height="820" rx="24" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="100" y="200" width="300" height="44" rx="12" fill="#FAF8F4"/>
  <text x="250" y="228" font-size="15" font-weight="bold" fill="#242321" text-anchor="middle">1. BRAND KNOWLEDGE SOURCES</text>

  <!-- Document cards -->
  <g transform="translate(105, 270)">
    <rect width="290" height="100" rx="14" fill="#FAF8F4" stroke="#E8E3DA"/>
    <rect x="16" y="20" width="8" height="60" rx="4" fill="#A85F48"/>
    <text x="36" y="48" font-size="16" font-weight="bold" fill="#242321">Garment Spec Sheets</text>
    <text x="36" y="72" font-size="13" fill="#77736C">Flat table chest, waist, hip (cm)</text>
  </g>

  <g transform="translate(105, 390)">
    <rect width="290" height="100" rx="14" fill="#FAF8F4" stroke="#E8E3DA"/>
    <rect x="16" y="20" width="8" height="60" rx="4" fill="#89947C"/>
    <text x="36" y="48" font-size="16" font-weight="bold" fill="#242321">Fabric &amp; Stretch Guide</text>
    <text x="36" y="72" font-size="13" fill="#77736C">Pure cambric cotton (0% stretch)</text>
  </g>

  <g transform="translate(105, 510)">
    <rect width="290" height="100" rx="14" fill="#FAF8F4" stroke="#E8E3DA"/>
    <rect x="16" y="20" width="8" height="60" rx="4" fill="#2E5A44"/>
    <text x="36" y="48" font-size="16" font-weight="bold" fill="#242321">Brand Fit &amp; Ease SOP</text>
    <text x="36" y="72" font-size="13" fill="#77736C">ISO 8559 anthropometric rules</text>
  </g>

  <g transform="translate(105, 630)">
    <rect width="290" height="100" rx="14" fill="#FAF8F4" stroke="#E8E3DA"/>
    <rect x="16" y="20" width="8" height="60" rx="4" fill="#C27803"/>
    <text x="36" y="48" font-size="16" font-weight="bold" fill="#242321">14-Day Returns Policy</text>
    <text x="36" y="72" font-size="13" fill="#77736C">Doorstep reverse exchange terms</text>
  </g>

  <g transform="translate(105, 750)">
    <rect width="290" height="100" rx="14" fill="#FAF8F4" stroke="#E8E3DA"/>
    <rect x="16" y="20" width="8" height="60" rx="4" fill="#682835"/>
    <text x="36" y="48" font-size="16" font-weight="bold" fill="#242321">Historical Return Clusters</text>
    <text x="36" y="72" font-size="13" fill="#77736C">Verbatim customer fit feedback</text>
  </g>

  <!-- Arrow 1 -> 2 -->
  <path d="M 420 590 L 490 590" stroke="#A85F48" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- STAGE 2: Document Processing & Embeddings -->
  <rect x="500" y="180" width="340" height="820" rx="24" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="520" y="200" width="300" height="44" rx="12" fill="#FAF8F4"/>
  <text x="670" y="228" font-size="15" font-weight="bold" fill="#242321" text-anchor="middle">2. INGESTION &amp; EMBEDDINGS</text>

  <g transform="translate(525, 290)">
    <rect width="290" height="120" rx="16" fill="#FAF8F4" stroke="#E8E3DA"/>
    <text x="24" y="46" font-size="16" font-weight="bold" fill="#242321">Text Chunker</text>
    <text x="24" y="74" font-size="13" fill="#77736C">Splits specs into 250-token blocks</text>
    <text x="24" y="96" font-size="11" font-weight="600" fill="#A85F48">Preserves SKU &amp; table metadata</text>
  </g>

  <g transform="translate(525, 450)">
    <rect width="290" height="120" rx="16" fill="#FAF8F4" stroke="#E8E3DA"/>
    <text x="24" y="46" font-size="16" font-weight="bold" fill="#242321">Embedding Model</text>
    <text x="24" y="74" font-size="13" fill="#77736C">Converts text into 768-dim vectors</text>
    <text x="24" y="96" font-size="11" font-weight="600" fill="#2E5A44">Dense semantic vector space</text>
  </g>

  <g transform="translate(525, 610)">
    <rect width="290" height="160" rx="16" fill="#242321"/>
    <text x="24" y="50" font-size="18" font-weight="bold" fill="#FAF8F4">Vector Database</text>
    <text x="24" y="80" font-size="13" fill="#E68A6E">Indexed Knowledge Index</text>
    <rect x="24" y="100" width="242" height="36" rx="8" fill="#FFFFFF" fill-opacity="0.1"/>
    <text x="145" y="123" font-size="12" font-mono="true" fill="#89947C" text-anchor="middle">cosine_similarity(q, d)</text>
  </g>

  <!-- Arrow 2 -> 3 -->
  <path d="M 840 590 L 910 590" stroke="#A85F48" stroke-width="4" stroke-dasharray="8 6" marker-end="url(#arrow)"/>

  <!-- STAGE 3: Semantic Query & Retrieval -->
  <rect x="920" y="180" width="450" height="820" rx="24" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="940" y="200" width="410" height="44" rx="12" fill="#FAF8F4"/>
  <text x="1145" y="228" font-size="15" font-weight="bold" fill="#242321" text-anchor="middle">3. REAL-TIME RETRIEVAL &amp; PROMPT ASSEMBLY</text>

  <!-- Customer query card -->
  <g transform="translate(945, 270)">
    <rect width="400" height="130" rx="18" fill="#F6EDE9" stroke="#A85F48"/>
    <text x="24" y="38" font-size="12" font-weight="bold" fill="#A85F48" letter-spacing="1">CUSTOMER PROMPT</text>
    <text x="24" y="70" font-family="'Playfair Display', Georgia, serif" font-size="18" font-weight="bold" fill="#242321">"Will this cotton kurta feel restrictive?"</text>
    <text x="24" y="100" font-size="12" fill="#77736C">Customer: Priya Sharma (Bust 90cm • Relaxed Fit)</text>
  </g>

  <!-- Vector search box -->
  <g transform="translate(945, 430)">
    <rect width="400" height="160" rx="18" fill="#FAF8F4" stroke="#E8E3DA"/>
    <text x="24" y="40" font-size="14" font-weight="bold" fill="#242321">Top Retrieved Knowledge Chunks</text>
    <rect x="20" y="58" width="360" height="38" rx="8" fill="#FFFFFF" stroke="#E8E3DA"/>
    <text x="32" y="82" font-size="12" font-weight="bold" fill="#2E5A44">Chunk 1 (94% Match): KRT-101 Cotton Spec Sheet</text>
    <rect x="20" y="104" width="360" height="38" rx="8" fill="#FFFFFF" stroke="#E8E3DA"/>
    <text x="32" y="128" font-size="12" font-weight="bold" fill="#A85F48">Chunk 2 (88% Match): Cambric Non-Stretch Ease Rule</text>
  </g>

  <!-- Grounded context packet -->
  <g transform="translate(945, 620)">
    <rect width="400" height="180" rx="18" fill="#2E5A44" fill-opacity="0.08" stroke="#2E5A44"/>
    <text x="24" y="40" font-size="13" font-weight="bold" fill="#2E5A44">GROUNDED SYSTEM CONTEXT</text>
    <text x="24" y="70" font-size="12" fill="#242321" font-family="monospace">Product: KRT-101 (Cambric Cotton, 0% Stretch)</text>
    <text x="24" y="95" font-size="12" fill="#242321" font-family="monospace">Garment Bust M: 92cm | L: 98cm</text>
    <text x="24" y="120" font-size="12" fill="#242321" font-family="monospace">Customer Body Bust: 90cm | Pref: Relaxed</text>
    <text x="24" y="145" font-size="12" font-weight="bold" fill="#A85F48" font-family="monospace">Rule: Non-stretch woven requires min +4cm ease</text>
  </g>

  <!-- Arrow 3 -> 4 -->
  <path d="M 1370 590 L 1440 590" stroke="#2E5A44" stroke-width="4" marker-end="url(#arrowGreen)"/>

  <!-- STAGE 4: Grounded AI Output -->
  <rect x="1450" y="180" width="390" height="820" rx="24" fill="#FFFFFF" stroke="#E8E3DA" stroke-width="2" filter="url(#shadow)"/>
  <rect x="1470" y="200" width="350" height="44" rx="12" fill="#242321"/>
  <text x="1645" y="228" font-size="15" font-weight="bold" fill="#FAF8F4" text-anchor="middle">4. GROUNDED AI RECOMMENDATION</text>

  <g transform="translate(1475, 270)">
    <rect width="340" height="480" rx="20" fill="#FAF8F4" stroke="#E8E3DA"/>
    
    <rect x="24" y="24" width="292" height="70" rx="12" fill="#A85F48"/>
    <text x="40" y="52" font-size="12" font-weight="bold" fill="#FFFFFF">FITBACK-AI RECOMMENDATION</text>
    <text x="40" y="76" font-serif font-size="20" font-weight="bold" fill="#FFFFFF">Recommend: Size L</text>

    <text x="24" y="130" font-size="13" font-weight="bold" fill="#242321">Why We Recommend Size L:</text>
    <text x="24" y="160" font-size="12" fill="#77736C" width="290">
      <tspan x="24" dy="0">"This kurta is crafted in 100% pure</tspan>
      <tspan x="24" dy="20">cambric cotton with zero stretch.</tspan>
      <tspan x="24" dy="20">Size M provides only +2cm of ease,</tspan>
      <tspan x="24" dy="20">which will feel restrictive when seated.</tspan>
      <tspan x="24" dy="20">Size L gives you +8cm of comfort</tspan>
      <tspan x="24" dy="20">room, perfectly matching your preference."</tspan>
    </text>

    <rect x="24" y="290" width="292" height="70" rx="12" fill="#FFFFFF" stroke="#E8E3DA"/>
    <text x="40" y="318" font-size="11" font-weight="bold" fill="#2E5A44">EVALUATION METRICS</text>
    <text x="40" y="342" font-size="14" font-weight="bold" fill="#242321">Confidence: 94% • ISO 8559 Compliant</text>

    <rect x="24" y="380" width="292" height="60" rx="12" fill="#E8E3DA" fill-opacity="0.4"/>
    <text x="40" y="405" font-size="10" font-weight="bold" fill="#77736C">VERIFIED SOURCE CITATIONS:</text>
    <text x="40" y="424" font-size="11" fill="#242321">KRT-101 Spec • Cotton Fabric Guide</text>
  </g>

  <!-- Trust Callout -->
  <g transform="translate(1475, 780)">
    <rect width="340" height="90" rx="16" fill="#2E5A44" fill-opacity="0.1" stroke="#2E5A44"/>
    <text x="20" y="36" font-size="12" font-weight="bold" fill="#2E5A44">RESPONSIBLE AI GUARANTEE:</text>
    <text x="20" y="60" font-size="11" fill="#242321">Recommendations are strictly advisory.</text>
    <text x="20" y="78" font-size="11" fill="#77736C">14-day exchange/refund rights fully preserved.</text>
  </g>

</svg>
